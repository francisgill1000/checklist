<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#6d5ef6" />
<title>Daily Checklist</title>
<script>
  // Resolve theme before paint to avoid a flash of the wrong colors.
  (function () {
    try {
      var saved = localStorage.getItem("daily-checklist-theme");
      var dark = saved ? saved === "dark"
        : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    --accent: #6d5ef6;
    --sheet: #ffffff;
    --page: #f5f6fb;
    --text: #1c1d2b;
    --muted: #9094a6;
    --field: #f1f2f8;
    --field-focus: #ffffff;
    --card: #ffffff;
    --line: #ebecf3;
    --check-border: #d6d8e4;
    --faint: #c2c5d4;
    --del-active: #fdeaea;
    --card-shadow: 0 2px 10px rgba(60, 50, 130, 0.05);
    --danger: #ef4444;
    --radius: 18px;
  }
  html[data-theme="dark"] {
    --sheet: #161922;
    --page: #0d0f15;
    --text: #edeef4;
    --muted: #9499ac;
    --field: #232733;
    --field-focus: #2b3040;
    --card: #232733;
    --line: #333949;
    --check-border: #404659;
    --faint: #5a6072;
    --del-active: rgba(248, 113, 113, 0.16);
    --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.38);
    --danger: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--page);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* ---------- gradient hero ---------- */
  .hero {
    background: var(--grad);
    padding: calc(18px + env(safe-area-inset-top)) 22px 42px;
    color: #fff;
    position: relative;
  }
  .greeting {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; opacity: 0.85;
  }
  .hero h1 {
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
    margin: 2px 0 2px;
  }
  .date { font-size: 12px; font-weight: 500; opacity: 0.85; }

  .progress {
    margin-top: 12px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 10px 14px;
  }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-top .count { font-size: 12px; font-weight: 600; opacity: 0.95; }
  .progress-top .pct { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .bar {
    height: 8px;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.22);
  }
  .bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #34d399, #22d3ee);
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.55);
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- white sheet ---------- */
  .sheet {
    background: var(--sheet);
    border-radius: 22px 22px 0 0;
    margin-top: -22px;
    padding: 16px 16px 0;
    position: relative;
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
  }

  /* add row */
  .add-row { display: flex; gap: 10px; flex-shrink: 0; }
  .add-row-sheet { padding: 4px 4px 6px; }
  .add-row input {
    flex: 1; border: 2px solid transparent;
    background: var(--field);
    border-radius: 14px; padding: 15px 16px;
    font-size: 16px; color: var(--text);
    outline: none; transition: border-color 0.15s, background 0.15s;
  }
  .add-row input:focus { border-color: var(--accent); background: var(--field-focus); }
  .add-row input::placeholder { color: var(--muted); }
  .add-btn {
    border: none; width: 54px; flex-shrink: 0;
    border-radius: 14px; color: #fff;
    background: var(--grad);
    font-size: 26px; line-height: 1; cursor: pointer;
    box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
    transition: transform 0.1s;
  }
  .add-btn:active { transform: scale(0.92); }

  /* list */
  ul {
    list-style: none; display: flex; flex-direction: column; gap: 10px;
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 2px 6px 16px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--faint) transparent;
  }
  ul::-webkit-scrollbar { width: 8px; }
  ul::-webkit-scrollbar-track { background: transparent; }
  ul::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 999px; }
  ul::-webkit-scrollbar-thumb:active { background: var(--muted); }
  li {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px;
    box-shadow: var(--card-shadow);
    animation: pop 0.25s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .check {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--check-border); background: transparent;
    flex-shrink: 0; display: grid; place-items: center;
    cursor: pointer; transition: all 0.18s;
  }
  .check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3.5; fill: none; opacity: 0; transition: opacity 0.15s; }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check svg { opacity: 1; }

  .task-text { flex: 1; font-size: 16px; font-weight: 500; word-break: break-word; line-height: 1.35; }
  li.done .task-text { color: var(--muted); text-decoration: line-through; }

  .del {
    border: none; background: transparent; color: var(--faint);
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    font-size: 17px; cursor: pointer; display: grid; place-items: center;
    transition: background 0.15s, color 0.15s;
  }
  .del:active { background: var(--del-active); color: var(--danger); }

  /* attachment */
  .attach {
    border: none; background: transparent; color: var(--muted);
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    cursor: pointer; display: grid; place-items: center;
    transition: background 0.15s, color 0.15s;
  }
  .attach svg { width: 20px; height: 20px; }
  .attach:active { background: var(--field); color: var(--accent); }
  .thumb-btn {
    position: relative; border: none; background: transparent;
    padding: 0; line-height: 0; flex-shrink: 0; cursor: pointer;
  }
  .thumb {
    width: 40px; height: 40px; border-radius: 10px;
    object-fit: cover; display: block;
    border: 1px solid var(--line);
  }
  .thumb-badge {
    position: absolute; top: -6px; right: -6px;
    min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 9px; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    box-shadow: 0 0 0 2px var(--card);
  }

  /* priority */
  .flag {
    border: none; background: transparent; color: var(--faint);
    width: 32px; height: 34px; border-radius: 10px; flex-shrink: 0;
    cursor: pointer; display: grid; place-items: center;
    transition: background 0.15s, color 0.15s;
  }
  .flag svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; }
  .flag.active svg { fill: currentColor; }
  .flag:active { background: var(--field); }
  .flag.p1 { color: #3b82f6; }
  .flag.p2 { color: #f59e0b; }
  .flag.p3 { color: #ef4444; }
  li.p1 { box-shadow: inset 4px 0 0 #3b82f6, var(--card-shadow); }
  li.p2 { box-shadow: inset 4px 0 0 #f59e0b, var(--card-shadow); }
  li.p3 { box-shadow: inset 4px 0 0 #ef4444, var(--card-shadow); }

  /* bottom-sheet picker */
  .sheet-modal {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(0, 0, 0, 0.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-modal.open { display: flex; }
  .sheet-card {
    width: 100%; max-width: 560px;
    background: var(--sheet);
    border-radius: 22px 22px 0 0;
    padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.3);
    animation: slideUp 0.22s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
  .sheet-title {
    font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em; padding: 6px 8px 10px;
  }
  .prio-opt {
    display: flex; align-items: center; gap: 13px; width: 100%;
    border: none; background: transparent; color: var(--text);
    padding: 15px 10px; font-size: 16px; font-weight: 600;
    cursor: pointer; border-radius: 12px; transition: background 0.15s;
  }
  .prio-opt:active { background: var(--field); }
  .prio-opt .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .dot.p3 { background: #ef4444; }
  .dot.p2 { background: #f59e0b; }
  .dot.p1 { background: #3b82f6; }
  .dot.none { background: transparent; border: 2px solid var(--check-border); }
  .opt-check { margin-left: auto; color: var(--accent); font-weight: 800; opacity: 0; }
  .prio-opt.sel .opt-check { opacity: 1; }

  /* date filter sheet */
  .date-row { display: flex; gap: 10px; padding: 2px 8px 12px; }
  .date-field { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .date-field > span {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .date-field .filter-date {
    width: 100%; height: 42px;
    border: 1.5px solid var(--line); background: var(--field);
    border-radius: 10px; padding: 0 12px; font-size: 14px;
    color: var(--text); font-family: inherit; outline: none;
    transition: border-color 0.15s;
  }
  .date-field .filter-date:focus { border-color: var(--accent); }
  .date-field .filter-date::-webkit-calendar-picker-indicator { filter: invert(0.45); cursor: pointer; opacity: 0.7; }
  html[data-theme="dark"] .date-field .filter-date::-webkit-calendar-picker-indicator { filter: invert(0.85); }
  .status-seg {
    display: flex; gap: 4px; padding: 4px;
    background: var(--field); border-radius: 10px;
    margin: 2px 8px 12px;
  }
  .status-seg button {
    flex: 1; border: none; background: transparent; color: var(--muted);
    padding: 9px 6px; border-radius: 7px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background 0.15s, color 0.15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .status-seg button .seg-n {
    min-width: 18px; padding: 0 5px; border-radius: 8px;
    font-size: 11px; line-height: 17px;
    background: rgba(128, 128, 128, 0.22);
  }
  .status-seg button.active { background: var(--accent); color: #fff; }
  .status-seg button.active .seg-n { background: rgba(255, 255, 255, 0.28); }
  .date-actions { display: flex; gap: 10px; padding: 4px 8px 2px; }
  .date-actions button {
    flex: 1; border-radius: 11px; padding: 11px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    border: none; transition: transform 0.1s;
  }
  .date-actions button:active { transform: scale(0.96); }
  .date-actions .primary-btn { color: #fff; background: var(--accent); }
  .date-actions .ghost-btn {
    background: transparent; border: 1.5px solid var(--line); color: var(--muted);
  }

  /* photo viewer */
  .lightbox {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0, 0, 0, 0.88);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%; max-height: 68vh;
    border-radius: 14px; object-fit: contain;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  .lb-counter { color: #fff; font-size: 14px; font-weight: 700; opacity: 0.9; }
  .lb-stage {
    position: relative; display: flex; align-items: center;
    justify-content: center; width: 100%; max-width: 520px;
  }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    border: none; background: rgba(255, 255, 255, 0.18); color: #fff;
    font-size: 28px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
  }
  .lb-nav:active { background: rgba(255, 255, 255, 0.34); }
  .lb-prev { left: 6px; }
  .lb-next { right: 6px; }
  .lightbox-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .lightbox-actions button {
    border: none; border-radius: 12px; padding: 12px 20px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    background: rgba(255, 255, 255, 0.16); color: #fff;
    transition: transform 0.1s;
  }
  .lightbox-actions button:active { transform: scale(0.94); }
  .lightbox-actions .lb-danger { background: var(--danger); }

  .empty {
    margin: auto; text-align: center; color: var(--muted);
    padding: 30px 20px; line-height: 1.5;
    display: flex; flex-direction: column; align-items: center;
  }
  .empty .emoji {
    width: 78px; height: 78px;
    display: grid; place-items: center; margin-bottom: 16px;
    background: var(--field); border-radius: 50%;
    color: var(--accent);
  }
  .empty .emoji svg { width: 34px; height: 34px; }
  .empty .et { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .empty .es { font-size: 14px; color: var(--muted); }

  /* ---------- bottom bar ---------- */
  .actions {
    flex: 0 0 auto;
    max-width: 560px; width: 100%; margin: 0 auto;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    background: var(--sheet);
    border-top: 1px solid var(--line);
    display: flex; gap: 10px;
  }
  .actions button {
    flex: 1; border: none; border-radius: 14px; padding: 14px 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform 0.1s, background 0.15s, color 0.15s;
  }
  .actions button:active { transform: scale(0.96); }
  .actions .primary {
    color: #fff; background: var(--accent);
    box-shadow: 0 6px 18px rgba(109, 94, 246, 0.30);
  }
  .actions .ghost {
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--muted);
  }
  .actions .ghost:active { background: var(--field); color: var(--danger); }
  .actions .ghost.filter-on { color: var(--accent); border-color: var(--accent); }

  /* theme toggle */
  .theme-toggle {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 18px;
    width: 36px; height: 36px; border-radius: 10px;
    border: none; background: rgba(255, 255, 255, 0.18);
    color: #fff; cursor: pointer;
    display: grid; place-items: center;
    transition: transform 0.12s, background 0.15s;
  }
  .theme-toggle:active { transform: scale(0.88); background: rgba(255, 255, 255, 0.3); }
  .theme-toggle svg { width: 20px; height: 20px; display: block; }

  /* constrain whole app on larger screens, keep mobile feel */
  .wrap {
    max-width: 560px; width: 100%; margin: 0 auto;
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode"></button>
      <div class="greeting" id="greeting">Today's focus</div>
      <h1>Daily Checklist</h1>
      <div class="date" id="date"></div>

      <div class="progress">
        <div class="progress-top">
          <span class="count" id="count">0 of 0 done</span>
          <span class="pct" id="pct">0%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      </div>
    </div>

    <div class="sheet">
      <ul id="list"></ul>
    </div>
  </div>

  <div class="actions">
    <button class="ghost" id="exportBtn">⬇ Export</button>
    <button class="ghost" id="filterBtn">⏷ Filter</button>
    <button class="primary" id="addBtn">+ Add</button>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />

  <div class="lightbox" id="lightbox">
    <div class="lb-counter" id="lbCounter">1 / 1</div>
    <div class="lb-stage">
      <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photo">‹</button>
      <img id="lightboxImg" alt="Task photo" />
      <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next photo">›</button>
    </div>
    <div class="lightbox-actions">
      <button id="lbAdd" type="button">+ Add</button>
      <button id="lbRemove" class="lb-danger" type="button">Remove</button>
      <button id="lbClose" type="button">Close</button>
    </div>
  </div>

  <div class="sheet-modal" id="prioSheet">
    <div class="sheet-card">
      <div class="sheet-title">Set priority</div>
      <button class="prio-opt" type="button" data-p="3"><span class="dot p3"></span>High<span class="opt-check">✓</span></button>
      <button class="prio-opt" type="button" data-p="2"><span class="dot p2"></span>Medium<span class="opt-check">✓</span></button>
      <button class="prio-opt" type="button" data-p="1"><span class="dot p1"></span>Low<span class="opt-check">✓</span></button>
      <button class="prio-opt" type="button" data-p="0"><span class="dot none"></span>None<span class="opt-check">✓</span></button>
    </div>
  </div>

  <div class="sheet-modal" id="addSheet">
    <div class="sheet-card">
      <div class="sheet-title">New task</div>
      <form class="add-row add-row-sheet" id="addForm">
        <input id="taskInput" type="text" placeholder="What needs doing?" autocomplete="off" maxlength="200" />
        <button class="add-btn" type="submit" aria-label="Add task">+</button>
      </form>
    </div>
  </div>

  <div class="sheet-modal" id="dateSheet">
    <div class="sheet-card">
      <div class="sheet-title">Filter</div>
      <div class="status-seg" id="statusSeg">
        <button type="button" data-s="pending" class="active">Pending<span class="seg-n" id="pendCount">0</span></button>
        <button type="button" data-s="completed">Completed<span class="seg-n" id="doneCount">0</span></button>
      </div>
      <div class="date-row">
        <label class="date-field">
          <span>From</span>
          <input type="date" id="fromDate" class="filter-date" aria-label="From date" />
        </label>
        <label class="date-field">
          <span>To</span>
          <input type="date" id="toDate" class="filter-date" aria-label="To date" />
        </label>
      </div>
      <div class="date-actions">
        <button type="button" id="allBtn" class="ghost-btn">Clear</button>
        <button type="button" id="applyDateBtn" class="primary-btn">Apply</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var KEY = "daily-checklist-tasks";
  var tasks = [];

  var listEl = document.getElementById("list");
  var inputEl = document.getElementById("taskInput");
  var formEl = document.getElementById("addForm");
  var countEl = document.getElementById("count");
  var pctEl = document.getElementById("pct");
  var barEl = document.getElementById("barFill");
  var greetEl = document.getElementById("greeting");
  var toggleEl = document.getElementById("themeToggle");
  var fromDateEl = document.getElementById("fromDate");
  var toDateEl = document.getElementById("toDate");
  var allBtn = document.getElementById("allBtn");
  var filterBtn = document.getElementById("filterBtn");
  var dateSheet = document.getElementById("dateSheet");
  var applyDateBtn = document.getElementById("applyDateBtn");
  var addBtn = document.getElementById("addBtn");
  var addSheet = document.getElementById("addSheet");
  var statusSeg = document.getElementById("statusSeg");
  var pendCount = document.getElementById("pendCount");
  var doneCount = document.getElementById("doneCount");
  var statusTab = "pending";   // "pending" | "completed"

  // local YYYY-MM-DD key for a date value
  function dateKey(d) {
    var dt = new Date(d);
    var m = ("0" + (dt.getMonth() + 1)).slice(-2);
    var day = ("0" + dt.getDate()).slice(-2);
    return dt.getFullYear() + "-" + m + "-" + day;
  }
  function hasFilter() { return !!(fromDateEl.value || toDateEl.value); }
  function visibleTasks() {
    var from = fromDateEl.value, to = toDateEl.value;
    if (!from && !to) return tasks;
    return tasks.filter(function (t) {
      var k = dateKey(t.createdAt);            // YYYY-MM-DD compares lexically
      if (from && k < from) return false;
      if (to && k > to) return false;
      return true;
    });
  }

  // ----- theme -----
  function isDark() { return document.documentElement.getAttribute("data-theme") === "dark"; }
  var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.5 12h2M19.5 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.64 13a1 1 0 0 0-1.05-.14 8 8 0 0 1-9.45-9.45A1 1 0 0 0 9.36 2 10 10 0 1 0 22 14.66a1 1 0 0 0-.36-1.66z"/></svg>';
  var ICON_CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="3.6"/></svg>';
  var ICON_FLAG = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';
  // empty-state line icons
  var IC_EMPTY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/></svg>';
  var IC_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  var IC_STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  var IC_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
  function syncThemeUI() {
    // show the icon for the mode you'd switch TO
    toggleEl.innerHTML = isDark() ? ICON_SUN : ICON_MOON;
  }
  toggleEl.addEventListener("click", function () {
    var dark = !isDark();
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    try { localStorage.setItem("daily-checklist-theme", dark ? "dark" : "light"); } catch (e) {}
    syncThemeUI();
  });

  // ----- attachments (camera / photos) -----
  var fileInput = document.getElementById("fileInput");
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var lbCounter = document.getElementById("lbCounter");
  var lbPrev = document.getElementById("lbPrev");
  var lbNext = document.getElementById("lbNext");
  var attachId = null;   // task awaiting chosen file(s)
  var viewId = null;     // task whose photos are open in the viewer
  var viewIndex = 0;     // current photo index in the viewer

  function findTask(id) {
    for (var i = 0; i < tasks.length; i++) { if (tasks[i].id === id) return tasks[i]; }
    return null;
  }

  // Resize/compress so photos fit in localStorage (limited to a few MB).
  function compressImage(file, maxDim, quality, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function () { cb(null); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function addImageToTask(id, dataUrl) {
    var t = findTask(id);
    if (!t) return false;
    if (!t.images) t.images = [];
    t.images.push(dataUrl);
    if (!save()) {                 // storage full -> revert this one
      t.images.pop();
      if (!t.images.length) delete t.images;
      save();
      alert("Couldn't save the photo — storage for this app is full. Try removing some photos.");
      return false;
    }
    return true;
  }

  function pickImage(id) {
    attachId = id;
    fileInput.value = "";
    fileInput.click();
  }

  fileInput.addEventListener("change", function () {
    var files = fileInput.files;
    if (!files || !files.length || attachId == null) return;
    var id = attachId;
    attachId = null;
    var list = Array.prototype.slice.call(files);
    // process sequentially to keep order and avoid canvas contention
    (function next(i) {
      if (i >= list.length) {
        render();
        if (lightbox.classList.contains("open")) renderLightbox();
        return;
      }
      compressImage(list[i], 1000, 0.7, function (dataUrl) {
        if (dataUrl) { if (!addImageToTask(id, dataUrl)) { render(); return; } }
        next(i + 1);
      });
    })(0);
  });

  function openLightbox(id, index) {
    var t = findTask(id);
    if (!t || !t.images || !t.images.length) return;
    viewId = id;
    viewIndex = index || 0;
    renderLightbox();
    lightbox.classList.add("open");
  }
  function renderLightbox() {
    var t = findTask(viewId);
    if (!t || !t.images || !t.images.length) { closeLightbox(); return; }
    if (viewIndex < 0) viewIndex = 0;
    if (viewIndex > t.images.length - 1) viewIndex = t.images.length - 1;
    lightboxImg.src = t.images[viewIndex];
    lbCounter.textContent = (viewIndex + 1) + " / " + t.images.length;
    var multi = t.images.length > 1;
    lbPrev.style.display = multi ? "" : "none";
    lbNext.style.display = multi ? "" : "none";
  }
  function closeLightbox() { lightbox.classList.remove("open"); viewId = null; }
  function step(dir) {
    var t = findTask(viewId);
    if (!t || !t.images) return;
    var n = t.images.length;
    viewIndex = (viewIndex + dir + n) % n;
    renderLightbox();
  }

  lbPrev.addEventListener("click", function () { step(-1); });
  lbNext.addEventListener("click", function () { step(1); });
  document.getElementById("lbAdd").addEventListener("click", function () {
    if (viewId != null) pickImage(viewId);
  });
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  document.getElementById("lbRemove").addEventListener("click", function () {
    var t = findTask(viewId);
    if (t && t.images) {
      t.images.splice(viewIndex, 1);
      if (!t.images.length) delete t.images;
      save();
    }
    render();
    if (!t || !t.images || !t.images.length) closeLightbox();
    else renderLightbox();
  });
  lightbox.addEventListener("click", function (e) { if (e.target === lightbox) closeLightbox(); });

  // ----- priority picker -----
  var prioSheet = document.getElementById("prioSheet");
  var prioTaskId = null;
  function openPrioSheet(id) {
    prioTaskId = id;
    var t = findTask(id);
    var cur = (t && t.priority) || 0;
    var opts = prioSheet.querySelectorAll(".prio-opt");
    for (var i = 0; i < opts.length; i++) {
      opts[i].classList.toggle("sel", +opts[i].getAttribute("data-p") === cur);
    }
    prioSheet.classList.add("open");
  }
  function closePrioSheet() { prioSheet.classList.remove("open"); prioTaskId = null; }
  prioSheet.addEventListener("click", function (e) {
    if (e.target === prioSheet) { closePrioSheet(); return; }
    var btn = e.target.closest ? e.target.closest(".prio-opt") : null;
    if (btn && prioTaskId != null) {
      setPriority(prioTaskId, +btn.getAttribute("data-p"));
      closePrioSheet();
    }
  });

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      tasks = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(tasks)) tasks = [];
      // migrate old single-image tasks to an images array
      tasks.forEach(function (t) {
        if (t.image && !t.images) t.images = [t.image];
        if (t.image) delete t.image;
      });
    } catch (e) { tasks = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); return true; }
    catch (e) { return false; }
  }

  function setHeader() {
    var now = new Date();
    var h = now.getHours();
    greetEl.textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });
  }

  function emptyHTML(emoji, title, sub) {
    return '<span class="emoji">' + emoji + '</span>' +
           '<span class="et">' + title + '</span>' +
           '<span class="es">' + sub + '</span>';
  }

  function render() {
    listEl.innerHTML = "";
    var dateItems = visibleTasks().slice().sort(function (a, b) {
      return (b.priority || 0) - (a.priority || 0);   // higher priority first, stable otherwise
    });
    var filtered = hasFilter();
    filterBtn.classList.toggle("filter-on", filtered);

    var total = dateItems.length;
    var done = 0;
    dateItems.forEach(function (t) { if (t.done) done++; });

    // status segmented control (in filter sheet)
    var segBtns = statusSeg.querySelectorAll("button");
    for (var si = 0; si < segBtns.length; si++) {
      segBtns[si].classList.toggle("active", segBtns[si].getAttribute("data-s") === statusTab);
    }
    pendCount.textContent = total - done;
    doneCount.textContent = done;

    var listItems = dateItems.filter(function (t) {
      return statusTab === "completed" ? t.done : !t.done;
    });

    if (listItems.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = statusTab === "completed"
        ? emptyHTML(IC_DONE, "No completed tasks", "Finished tasks show up here.")
        : (total > 0
            ? emptyHTML(IC_STAR, "All done!", "You've cleared everything.")
            : (filtered
                ? emptyHTML(IC_CAL, "No tasks in this range", "Try a different date.")
                : emptyHTML(IC_EMPTY, "No tasks yet", "Add your first one above.")));
      listEl.appendChild(empty);
    } else {
      listItems.forEach(function (t) {
        var prio = t.priority || 0;
        var li = document.createElement("li");
        var cls = [];
        if (t.done) cls.push("done");
        if (prio) cls.push("p" + prio);
        li.className = cls.join(" ");

        var check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", t.done ? "Mark not done" : "Mark done");
        check.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        check.addEventListener("click", function () { toggle(t.id); });

        var flag = document.createElement("button");
        flag.className = "flag" + (prio ? " active p" + prio : "");
        flag.type = "button";
        flag.setAttribute("aria-label", "Set priority");
        flag.innerHTML = ICON_FLAG;
        flag.addEventListener("click", function () { openPrioSheet(t.id); });

        var span = document.createElement("span");
        span.className = "task-text";
        span.textContent = t.text;

        var media;
        if (t.images && t.images.length) {
          media = document.createElement("button");
          media.className = "thumb-btn";
          media.type = "button";
          media.setAttribute("aria-label", "View photos");
          var im = document.createElement("img");
          im.className = "thumb";
          im.src = t.images[0];
          im.alt = "Task photo";
          media.appendChild(im);
          if (t.images.length > 1) {
            var badge = document.createElement("span");
            badge.className = "thumb-badge";
            badge.textContent = t.images.length;
            media.appendChild(badge);
          }
          media.addEventListener("click", function () { openLightbox(t.id, 0); });
        } else {
          media = document.createElement("button");
          media.className = "attach";
          media.type = "button";
          media.setAttribute("aria-label", "Add photo");
          media.innerHTML = ICON_CAMERA;
          media.addEventListener("click", function () { pickImage(t.id); });
        }

        var del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.setAttribute("aria-label", "Delete task");
        del.textContent = "✕";
        del.addEventListener("click", function () { remove(t.id); });

        li.appendChild(check);
        li.appendChild(flag);
        li.appendChild(span);
        li.appendChild(media);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    var pct = total ? Math.round((done / total) * 100) : 0;
    countEl.textContent = done + " of " + total + " done";
    pctEl.textContent = pct + "%";
    barEl.style.width = pct + "%";
  }

  function addTask(text) {
    text = text.trim();
    if (!text) return;
    var task = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), text: text, done: false, createdAt: new Date().toISOString() };
    tasks.push(task);
    // a new task is "today" — if the active range would hide it, clear the range so it stays visible
    if (visibleTasks().indexOf(task) === -1) { fromDateEl.value = ""; toDateEl.value = ""; }
    statusTab = "pending";   // a new task is pending — show it
    save(); render();
  }
  function toggle(id) {
    tasks.forEach(function (t) { if (t.id === id) t.done = !t.done; });
    save(); render();
  }
  function setPriority(id, p) {
    var t = findTask(id);
    if (!t) return;
    if (p) t.priority = p; else delete t.priority;
    save(); render();
  }
  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save(); render();
  }

  function csvCell(v) {
    v = String(v == null ? "" : v);
    if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function exportCSV() {
    if (tasks.length === 0) { alert("No tasks to export."); return; }
    var rows = [["Task", "Priority", "Status", "Photos", "Created"]];
    var pName = { 3: "High", 2: "Medium", 1: "Low" };
    tasks.forEach(function (t) {
      var created = "";
      try { created = new Date(t.createdAt).toLocaleString(); } catch (e) {}
      var n = t.images ? t.images.length : 0;
      rows.push([t.text, pName[t.priority] || "", t.done ? "Done" : "Pending", n, created]);
    });
    var csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "checklist-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = inputEl.value;
    addTask(v);
    inputEl.value = "";
    if (v.trim()) closeAddSheet();
    else inputEl.focus();
  });
  function openAddSheet() {
    addSheet.classList.add("open");
    setTimeout(function () { inputEl.focus(); }, 60);
  }
  function closeAddSheet() { addSheet.classList.remove("open"); }
  addBtn.addEventListener("click", openAddSheet);
  addSheet.addEventListener("click", function (e) {
    if (e.target === addSheet) closeAddSheet();
  });
  fromDateEl.addEventListener("change", render);
  toDateEl.addEventListener("change", render);
  allBtn.addEventListener("click", function () {
    fromDateEl.value = ""; toDateEl.value = "";
    render();
    closeDateSheet();
  });
  applyDateBtn.addEventListener("click", function () { render(); closeDateSheet(); });
  filterBtn.addEventListener("click", openDateSheet);
  dateSheet.addEventListener("click", function (e) {
    if (e.target === dateSheet) closeDateSheet();
  });
  function openDateSheet() { dateSheet.classList.add("open"); }
  function closeDateSheet() { dateSheet.classList.remove("open"); }
  statusSeg.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("button[data-s]") : null;
    if (!btn) return;
    statusTab = btn.getAttribute("data-s");
    render();
  });
  document.getElementById("exportBtn").addEventListener("click", exportCSV);

  load();
  setHeader();
  syncThemeUI();
  render();
})();
</script>
</body>
</html>
